[project]
name = "macaulay2-mcp"
version = "0.1.2"
description = "MCP server for Macaulay2: Groebner bases, resolutions, Betti tables, and more, for Claude Code, opencode, and any MCP client"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "Youngsu Kim" }]
keywords = ["macaulay2", "mcp", "model-context-protocol", "algebraic-geometry", "computer-algebra"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "mcp>=2.0,<3",
]

[project.scripts]
macaulay2-mcp = "macaulay2_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macaulay2_mcp"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E1/E2/E3/W (indentation, blank lines, trailing whitespace) are preview-only
# rules in ruff 0.16 — pycodestyle was migrated to preview — so lint preview
# must be on. But preview also revives stray rules from other families, so
# the rule set is pinned explicitly (not extend-select) to pycodestyle +
# pyflakes + isort. E501 stays off: line-length is a formatter setting, not
# a correctness rule, and rewrapping long strings here buys nothing.
preview = true
select = ["E1", "E2", "E3", "E4", "E7", "E9", "F", "I", "W"]
ignore = ["E501"]
